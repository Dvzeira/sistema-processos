version: "3.9"

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: processos_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: laravel_app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: processos_db
      DB_USERNAME: root
      DB_PASSWORD: root
    command: >
      sh -c "
      echo '⏳ esperando MySQL...' &&
      until php -r \"try { new PDO('mysql:host=db;port=3306;dbname=processos_db', 'root', 'root'); echo 'ok'; } catch(Exception \$e) { exit(1); }\"; do
        sleep 2;
      done &&
      echo '✅ MySQL pronto!' &&
      php artisan config:clear &&
      php artisan cache:clear &&
      php artisan key:generate &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: ./frontend
    container_name: react_app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  db_data: